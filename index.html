<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07070B"
  >

  <meta
    name="description"
    content="Mathix Admin Login"
  >

  <title>Mathix Admin</title>

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #07070B;
      --bg-2: #0A0A10;

      --card: #0E0E15;
      --card-2: #12121B;

      --white: #FFFFFF;
      --text: #F3F3F7;

      --muted: #898996;
      --muted-2: #62626E;

      --purple: #8B5CF6;
      --purple-light: #A78BFA;
      --purple-dark: #6D28D9;

      --red: #EF4444;
      --green: #22C55E;

      --border: rgba(255,255,255,0.075);
      --border-hover: rgba(255,255,255,0.14);

      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(139,92,246,0.14),
          transparent 34%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(139,92,246,0.07),
          transparent 30%
        ),
        var(--bg);

      font-family: "Alexandria", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    input {
      outline: none;
    }

    .numbers {
      font-family: "Space Grotesk", sans-serif;
      font-variant-numeric: lining-nums tabular-nums;
    }

    /* =========================
       LOADING
    ========================= */

    #loadingScreen {
      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--bg);
    }

    .loader {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--purple);

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       LOGIN
    ========================= */

    .page {
      width: 100%;
      max-width: 470px;
    }

    .brand {
      text-align: center;

      margin-bottom: 28px;
    }

    .logo {
      width: 82px;
      height: 82px;

      object-fit: contain;

      margin-bottom: 14px;

      filter:
        drop-shadow(
          0 0 24px
          rgba(139,92,246,0.28)
        );

      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

    }

    .brand-name {
      font-family: "Space Grotesk", sans-serif;

      font-size: 31px;
      font-weight: 700;

      letter-spacing: -1.4px;
    }

    .brand-name span {
      color: var(--purple);
    }

    .brand-subtitle {
      color: var(--muted);

      font-size: 11px;

      margin-top: 8px;
    }

    .login-card {

      padding: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.012)
        ),
        var(--card);

      border: 1px solid var(--border);

      border-radius: 28px;

      box-shadow:
        0 35px 100px
        rgba(0,0,0,0.48);
    }

    .security-badge {
      width: fit-content;

      display: flex;
      align-items: center;

      gap: 8px;

      margin: 0 auto 22px;

      padding: 8px 11px;

      border-radius: 30px;

      color: var(--purple-light);

      background:
        rgba(139,92,246,0.08);

      border:
        1px solid
        rgba(139,92,246,0.16);

      font-size: 9px;
    }

    .security-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 8px
        rgba(34,197,94,0.55);
    }

    .heading {
      text-align: center;

      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 20px;

      font-weight: 700;
    }

    .heading p {
      color: var(--muted);

      font-size: 10px;

      line-height: 1.8;

      margin-top: 8px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;

      color: #CFCFD8;

      font-size: 10px;
      font-weight: 500;

      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--muted);

      font-size: 15px;

      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;

      height: 51px;

      padding:
        0 43px
        0 14px;

      color: var(--white);

      background:
        rgba(255,255,255,0.025);

      border:
        1px solid
        var(--border);

      border-radius: 14px;

      font-size: 11px;

      transition: 0.2s ease;
    }

    .input-wrap input::placeholder {
      color: var(--muted-2);
    }

    .input-wrap input:focus {
      border-color:
        rgba(139,92,246,0.55);

      background:
        rgba(139,92,246,0.035);

      box-shadow:
        0 0 0 3px
        rgba(139,92,246,0.08);
    }

    .password-toggle {
      position: absolute;

      left: 12px;
      top: 50%;

      transform: translateY(-50%);

      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      color: var(--muted);

      background: transparent;

      transition: 0.2s ease;
    }

    .password-toggle:hover {
      color: var(--white);

      background:
        rgba(255,255,255,0.05);
    }

    .login-button {
      width: 100%;

      height: 52px;

      margin-top: 6px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border-radius: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple-dark)
        );

      box-shadow:
        0 12px 30px
        rgba(109,40,217,0.22);

      font-size: 11px;
      font-weight: 600;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 16px 35px
        rgba(109,40,217,0.30);
    }

    .login-button:disabled {
      cursor: not-allowed;

      opacity: 0.65;

      transform: none;
    }

    .button-loader {
      width: 17px;
      height: 17px;

      border-radius: 50%;

      border:
        2px solid
        rgba(255,255,255,0.3);

      border-top-color: white;

      animation:
        spin 0.7s linear infinite;
    }

    .error-box {
      display: none;

      padding: 12px 13px;

      margin-bottom: 16px;

      color: #FCA5A5;

      background:
        rgba(239,68,68,0.07);

      border:
        1px solid
        rgba(239,68,68,0.17);

      border-radius: 12px;

      font-size: 10px;

      line-height: 1.8;
    }

    .error-box.show {
      display: block;
    }

    .footer {
      text-align: center;

      color: var(--muted-2);

      font-size: 9px;

      margin-top: 22px;
    }

    .footer strong {
      color: var(--purple-light);

      font-family: "Space Grotesk", sans-serif;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .logo {
        width: 70px;
        height: 70px;
      }

      .brand-name {
        font-size: 27px;
      }

      .login-card {
        padding: 23px 19px;

        border-radius: 23px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOADING
  ========================= -->

  <div id="loadingScreen">

    <div class="loader"></div>

  </div>


  <!-- =========================
       PAGE
  ========================= -->

  <main
    id="page"
    class="page"
    style="display:none;"
  >


    <div class="brand">

      <img
        src="logo.png"
        alt="Mathix"
        class="logo"
      >

      <div class="brand-name">
        MATH<span>IX</span>
      </div>

      <div class="brand-subtitle">
        ADMIN CONTROL CENTER
      </div>

    </div>


    <section class="login-card">


      <div class="security-badge">

        <span class="security-dot"></span>

        نظام إدارة محمي

      </div>


      <div class="heading">

        <h1>
          دخول الإدارة
        </h1>

        <p>
          سجّل الدخول باستخدام حساب Admin المعتمد
        </p>

      </div>


      <div
        id="errorBox"
        class="error-box"
      ></div>


      <form id="loginForm">


        <div class="field">

          <label for="email">
            البريد الإلكتروني
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              @
            </span>

            <input
              id="email"
              type="email"
              autocomplete="username"
              placeholder="أدخل البريد الإلكتروني"
              required
            >

          </div>

        </div>


        <div class="field">

          <label for="password">
            كلمة المرور
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              ●
            </span>

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="أدخل كلمة المرور"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="إظهار كلمة المرور"
            >
              ◉
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >

          <span id="loginText">
            دخول لوحة التحكم
          </span>

        </button>


      </form>


    </section>


    <div class="footer">

      Protected by
      <strong>Mathix</strong>

    </div>


  </main>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCH--HkIXYn3qhXZ9TwRItZrnMOIx_lWXk",

      authDomain:
        "mathix-2008.firebaseapp.com",

      projectId:
        "mathix-2008",

      storageBucket:
        "mathix-2008.firebasestorage.app",

      messagingSenderId:
        "561805658834",

      appId:
        "1:561805658834:web:c1db8ebc2d415be9497b0b",

      measurementId:
        "G-XWHKQ72FM0"

    };


    /* =========================
       INIT
    ========================= */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loadingScreen =
      document.getElementById(
        "loadingScreen"
      );


    const page =
      document.getElementById(
        "page"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const togglePassword =
      document.getElementById(
        "togglePassword"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const loginText =
      document.getElementById(
        "loginText"
      );


    const errorBox =
      document.getElementById(
        "errorBox"
      );


    /* =========================
       SHOW PAGE
    ========================= */

    function showPage() {

      loadingScreen.style.display =
        "none";

      page.style.display =
        "block";

    }


    /* =========================
       ERROR
    ========================= */

    function showError(message) {

      errorBox.textContent =
        message;

      errorBox.classList.add(
        "show"
      );

    }


    function hideError() {

      errorBox.textContent = "";

      errorBox.classList.remove(
        "show"
      );

    }


    /* =========================
       FIREBASE ERROR TRANSLATION
    ========================= */

    function translateError(error) {

      const code =
        error?.code || "";


      switch (code) {

        case "auth/invalid-credential":

        case "auth/wrong-password":

        case "auth/user-not-found":

          return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";


        case "auth/invalid-email":

          return "البريد الإلكتروني غير صحيح.";


        case "auth/too-many-requests":

          return "تمت محاولات تسجيل دخول كثيرة. حاول مرة أخرى لاحقًا.";


        case "auth/network-request-failed":

          return "تعذر الاتصال بالإنترنت. تأكد من اتصالك وحاول مرة أخرى.";


        case "auth/user-disabled":

          return "هذا الحساب تم تعطيله.";


        default:

          return "حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";

      }

    }


    /* =========================
       CHECK ADMIN
    ========================= */

    async function checkAdmin(
      user
    ) {

      if (!user) {

        return false;

      }


      const adminRef =
        doc(
          db,
          "admins",
          user.uid
        );


      const adminSnap =
        await getDoc(
          adminRef
        );


      if (
        !adminSnap.exists()
      ) {

        return false;

      }


      const data =
        adminSnap.data();


      return data.active === true;

    }


    /* =========================
       AUTH STATE
    ========================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        try {

          if (!user) {

            showPage();

            return;

          }


          const isAdmin =
            await checkAdmin(
              user
            );


          if (isAdmin) {

            window.location.href =
              "admin.html";

            return;

          }


          showPage();

        }
        catch (error) {

          console.error(
            "Admin check error:",
            error
          );

          showPage();

        }

      }
    );


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    togglePassword.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type ===
          "password";


        passwordInput.type =
          isPassword
            ? "text"
            : "password";


        togglePassword.textContent =
          isPassword
            ? "◉"
            : "◌";

      }
    );


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideError();


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        if (!email) {

          showError(
            "اكتب البريد الإلكتروني."
          );

          return;

        }


        if (!password) {

          showError(
            "اكتب كلمة المرور."
          );

          return;

        }


        loginButton.disabled =
          true;


        loginText.innerHTML =
          '<span class="button-loader"></span> جاري التحقق...';


        try {

          await setPersistence(
            auth,
            browserLocalPersistence
          );


          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          const isAdmin =
            await checkAdmin(
              user
            );


          if (!isAdmin) {

            showError(
              "تم تسجيل الدخول، لكن هذا الحساب ليس لديه صلاحية Admin."
            );


            /*
             * Firebase remains signed in here.
             * Sign-out is handled below so a normal
             * student account does not remain inside
             * the admin session.
             */

            try {

              await auth.signOut();

            }
            catch (signOutError) {

              console.error(
                signOutError
              );

            }


            loginButton.disabled =
              false;

            loginText.textContent =
              "دخول لوحة التحكم";

            return;

          }


          loginText.textContent =
            "تم التحقق ✓";


          window.location.href =
            "admin.html";

        }
        catch (error) {

          console.error(
            "Login error:",
            error
          );


          showError(
            translateError(
              error
            )
          );


          loginButton.disabled =
            false;


          loginText.textContent =
            "دخول لوحة التحكم";

        }

      }
    );

  </script>

</body>
</html>
