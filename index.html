<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#07070b">

<meta name="description" content="Mathix - تسجيل دخول الإدارة">

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<title>Mathix | تسجيل الدخول</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap"
rel="stylesheet"
>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#07070b;
--card:#101016;
--card2:#15151d;
--border:rgba(255,255,255,.08);
--text:#fff;
--muted:#9999a8;
--purple:#8b5cf6;
--purple-light:#a78bfa;
}

body{
min-height:100vh;
font-family:"Cairo",sans-serif;
background:
radial-gradient(
circle at 50% -15%,
rgba(139,92,246,.20),
transparent 38%
),
var(--bg);
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:450px;
}

.brand{
text-align:center;
margin-bottom:24px;
}

.logo{
width:86px;
height:86px;
object-fit:contain;
display:block;
margin:0 auto 12px;
filter:drop-shadow(0 0 22px rgba(139,92,246,.38));
}

.brand-name{
font-family:"Chakra Petch",sans-serif;
font-size:31px;
font-weight:700;
letter-spacing:1px;
}

.brand-name span{
color:var(--purple-light);
}

.admin-label{
display:inline-flex;
align-items:center;
gap:7px;
margin-top:7px;
padding:5px 11px;
border-radius:999px;
background:rgba(139,92,246,.09);
border:1px solid rgba(139,92,246,.18);
color:var(--purple-light);
font-size:11px;
font-weight:700;
}

.admin-dot{
width:6px;
height:6px;
border-radius:50%;
background:var(--purple-light);
box-shadow:0 0 10px var(--purple);
}

.card{
background:
linear-gradient(
145deg,
rgba(255,255,255,.045),
rgba(255,255,255,.012)
),
var(--card);
border:1px solid var(--border);
border-radius:24px;
padding:30px;
box-shadow:
0 28px 90px rgba(0,0,0,.48),
inset 0 1px 0 rgba(255,255,255,.03);
}

.title{
margin-bottom:23px;
}

.title h1{
font-size:24px;
font-weight:800;
margin-bottom:5px;
}

.title p{
color:var(--muted);
font-size:13px;
line-height:1.8;
}

.field{
margin-bottom:16px;
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:8px;
}

.input-wrap{
position:relative;
}

.input{
width:100%;
height:53px;
border:1px solid var(--border);
border-radius:14px;
outline:none;
background:var(--card2);
color:white;
padding:0 15px;
font-family:"Cairo",sans-serif;
font-size:14px;
transition:.2s ease;
}

.input::placeholder{
color:#666674;
}

.input:focus{
border-color:rgba(139,92,246,.75);
box-shadow:0 0 0 3px rgba(139,92,246,.10);
}

.password-toggle{
position:absolute;
left:13px;
top:50%;
transform:translateY(-50%);
border:0;
background:transparent;
color:#8d8d9b;
cursor:pointer;
font-family:"Cairo",sans-serif;
font-size:12px;
}

.forgot{
text-align:left;
margin-top:-3px;
margin-bottom:18px;
}

.forgot button{
border:0;
background:transparent;
color:var(--purple-light);
cursor:pointer;
font-family:"Cairo",sans-serif;
font-size:12px;
}

.login-btn{
width:100%;
height:54px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#7c3aed,#8b5cf6);
color:white;
font-family:"Cairo",sans-serif;
font-size:15px;
font-weight:800;
cursor:pointer;
transition:.2s ease;
box-shadow:0 12px 30px rgba(124,58,237,.22);
}

.login-btn:hover{
transform:translateY(-1px);
}

.login-btn:disabled{
opacity:.55;
cursor:not-allowed;
transform:none;
}

.message{
display:none;
margin-bottom:16px;
padding:12px 14px;
border-radius:12px;
font-size:12px;
line-height:1.8;
}

.message.error{
display:block;
color:#fecaca;
background:rgba(239,68,68,.10);
border:1px solid rgba(239,68,68,.20);
}

.message.success{
display:block;
color:#bbf7d0;
background:rgba(34,197,94,.10);
border:1px solid rgba(34,197,94,.20);
}

.security-note{
margin-top:18px;
padding-top:17px;
border-top:1px solid rgba(255,255,255,.06);
text-align:center;
color:#707080;
font-size:11px;
line-height:1.8;
}

@media(max-width:520px){

.card{
padding:23px 18px;
border-radius:20px;
}

.brand-name{
font-size:28px;
}

.logo{
width:72px;
height:72px;
}

}

</style>

</head>

<body>

<main class="container">

<div class="brand">

<img
class="logo"
src="logo.png"
alt="Mathix"
>

<div class="brand-name">
<span>Math</span>ix
</div>

<div class="admin-label">

<span class="admin-dot"></span>

لوحة تحكم الإدارة

</div>

</div>

<section class="card">

<div class="title">

<h1>
تسجيل الدخول
</h1>

<p>
أدخل بيانات الحساب الإداري للمتابعة.
</p>

</div>

<div
id="message"
class="message"
></div>

<form id="loginForm">

<div class="field">

<label for="email">
البريد الإلكتروني
</label>

<input
class="input"
id="email"
type="email"
autocomplete="username"
placeholder="z1wae12008@gmail.com"
required
>

</div>

<div class="field">

<label for="password">
كلمة المرور
</label>

<div class="input-wrap">

<input
class="input"
id="password"
type="password"
autocomplete="current-password"
placeholder="أدخل كلمة المرور"
required
>

<button
class="password-toggle"
id="togglePassword"
type="button"
>
إظهار
</button>

</div>

</div>

<div class="forgot">

<button
type="button"
id="forgotPassword"
>
نسيت كلمة المرور؟
</button>

</div>

<button
class="login-btn"
id="loginButton"
type="submit"
>
تسجيل الدخول
</button>

</form>

<div class="security-note">

الدخول مسموح للحساب الإداري المصرح به فقط.

<br>

صلاحيات الإدارة محمية عبر Firebase Authentication وFirestore Rules.

</div>

</section>

</main>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

apiKey:
"AIzaSyCvMG9-rIdjnzQR_plZyizpQAhxQ_ASIn0",

authDomain:
"mathix-88811.firebaseapp.com",

projectId:
"mathix-88811",

storageBucket:
"mathix-88811.firebasestorage.app",

messagingSenderId:
"1043867239139",

appId:
"1:1043867239139:web:da19abef81f052682bbbd6",

measurementId:
"G-T17ZDVBLM2"

};


const ADMIN_EMAIL =
"z1wae12008@gmail.com";


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const loginForm =
document.getElementById("loginForm");


const emailInput =
document.getElementById("email");


const passwordInput =
document.getElementById("password");


const togglePassword =
document.getElementById("togglePassword");


const forgotPassword =
document.getElementById("forgotPassword");


const loginButton =
document.getElementById("loginButton");


const message =
document.getElementById("message");


function showMessage(
text,
type="error"
){

message.textContent=text;

message.className=
`message ${type}`;

}


function clearMessage(){

message.textContent="";

message.className="message";

}


function isAdmin(user){

return !!(
user &&
user.email &&
user.email.toLowerCase() ===
ADMIN_EMAIL.toLowerCase()
);

}


function translateError(error){

const code=error?.code||"";

const errors={

"auth/invalid-email":
"البريد الإلكتروني غير صحيح.",

"auth/user-not-found":
"لا يوجد حساب بهذا البريد الإلكتروني.",

"auth/wrong-password":
"كلمة المرور غير صحيحة.",

"auth/invalid-credential":
"البريد الإلكتروني أو كلمة المرور غير صحيحة.",

"auth/user-disabled":
"هذا الحساب تم تعطيله.",

"auth/too-many-requests":
"تمت محاولات كثيرة. حاول مرة أخرى بعد قليل.",

"auth/network-request-failed":
"حدثت مشكلة في الاتصال بالإنترنت.",

"auth/operation-not-allowed":
"تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase."

};

return errors[code] ||
`حدث خطأ في Firebase: ${code||"unknown"}`;

}


togglePassword.addEventListener(
"click",
()=>{

const hidden =
passwordInput.type === "password";

passwordInput.type =
hidden ? "text" : "password";

togglePassword.textContent =
hidden ? "إخفاء" : "إظهار";

}
);


loginForm.addEventListener(
"submit",
async event=>{

event.preventDefault();

clearMessage();


const email =
emailInput.value.trim();

const password =
passwordInput.value;


if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

showMessage(
"هذا البريد الإلكتروني غير مصرح له بالدخول إلى لوحة الإدارة."
);

return;

}


loginButton.disabled=true;

loginButton.textContent=
"جاري تسجيل الدخول...";


try{

const credential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const user =
credential.user;


console.log(
"ADMIN LOGIN SUCCESS",
user.email
);


if(!isAdmin(user)){

showMessage(
"هذا الحساب غير مصرح له بالدخول."
);

return;

}


showMessage(
"تم تسجيل الدخول بنجاح...",
"success"
);


window.location.replace(
"dashboard.html"
);


}catch(error){

console.error(
"ADMIN LOGIN ERROR:",
error
);

showMessage(
translateError(error)
);

}finally{

loginButton.disabled=false;

loginButton.textContent=
"تسجيل الدخول";

}

}
);


forgotPassword.addEventListener(
"click",
async()=>{

clearMessage();


const email =
emailInput.value.trim();


if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

showMessage(
"اكتب البريد الإلكتروني الخاص بالأدمن."
);

return;

}


forgotPassword.disabled=true;

forgotPassword.textContent=
"جاري الإرسال...";


try{

await sendPasswordResetEmail(
auth,
email
);

showMessage(
"تم إرسال رابط إعادة تعيين كلمة المرور.",
"success"
);

}catch(error){

console.error(
"PASSWORD RESET ERROR:",
error
);

showMessage(
`كود الخطأ: ${error?.code||"unknown"}`
);

}finally{

forgotPassword.disabled=false;

forgotPassword.textContent=
"نسيت كلمة المرور؟";

}

}
);

</script>

</body>

</html>
