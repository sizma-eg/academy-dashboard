<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070b">

  <title>الامتحانات</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #07070b;
      --card: #101017;
      --card2: #15151e;
      --border: rgba(255,255,255,.08);
      --text: #f7f7fb;
      --muted: #9696a8;
      --purple: #8b5cf6;
      --purple2: #6d28d9;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Cairo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 80% 0%, rgba(139,92,246,.10), transparent 30%),
        var(--bg);
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      position: fixed;
      inset: 0 0 0 auto;
      background: rgba(10,10,15,.97);
      border-left: 1px solid var(--border);
      padding: 24px 16px;
      z-index: 100;
      transition: .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 26px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 12px;
    }

    .brand-name {
      font-family: "Chakra Petch", sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .nav {
      display: grid;
      gap: 7px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
      transition: .2s;
    }

    .nav a:hover,
    .nav a.active {
      color: #fff;
      background: rgba(139,92,246,.13);
    }

    .nav a.active {
      box-shadow: inset -3px 0 0 var(--purple);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 17px;
    }

    .logout {
      position: absolute;
      right: 16px;
      left: 16px;
      bottom: 20px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,.18);
      background: rgba(239,68,68,.08);
      color: #fca5a5;
      font-weight: 700;
    }

    .main {
      width: calc(100% - 260px);
      margin-right: 260px;
      padding: 30px;
    }

    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
      font-size: 20px;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-head h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .page-head p {
      color: var(--muted);
      font-size: 14px;
    }

    .primary-btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(109,40,217,.2);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .search {
      flex: 1;
      position: relative;
    }

    .search span {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search input {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      background: var(--card);
      color: #fff;
      padding: 0 44px 0 15px;
    }

    .search input:focus {
      border-color: rgba(139,92,246,.55);
    }

    .filter {
      min-width: 190px;
    }

    .filter select {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
      padding: 0 12px;
      outline: none;
    }

    .count {
      min-width: 110px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
    }

    .exams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .exam-card {
      background: linear-gradient(145deg, rgba(21,21,30,.98), rgba(12,12,18,.98));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      transition: .2s;
    }

    .exam-card:hover {
      transform: translateY(-2px);
      border-color: rgba(139,92,246,.28);
    }

    .exam-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 15px;
    }

    .exam-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: rgba(139,92,246,.12);
      border: 1px solid rgba(139,92,246,.18);
      color: #c4b5fd;
      font-size: 22px;
    }

    .status {
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .status.open {
      color: #bbf7d0;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.2);
    }

    .status.closed {
      color: #fecaca;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.2);
    }

    .exam-card h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .description {
      min-height: 44px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .meta-item {
      padding: 9px;
      border-radius: 10px;
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-size: 11px;
    }

    .meta-item strong {
      display: block;
      color: #fff;
      font-size: 13px;
      margin-top: 2px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .price {
      color: #c4b5fd;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .small-btn {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 10px;
      background: rgba(255,255,255,.03);
      color: #ddd;
      font-size: 12px;
    }

    .small-btn:hover {
      background: rgba(255,255,255,.07);
    }

    .small-btn.delete {
      color: #fca5a5;
    }

    .empty,
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      border-radius: 18px;
      background: var(--card);
      border: 1px dashed var(--border);
      color: var(--muted);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(7px);
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: min(650px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #101017;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-head h2 {
      font-size: 20px;
    }

    .close {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: #fff;
      font-size: 18px;
    }

    form {
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 13px;
      color: #ddd;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #0b0b10;
      color: #fff;
      padding: 11px 12px;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: rgba(139,92,246,.55);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 7px;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--purple);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .secondary-btn {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255,255,255,.04);
      color: #fff;
      padding: 11px 18px;
      font-weight: 700;
    }

    .message {
      position: fixed;
      left: 25px;
      bottom: 25px;
      max-width: 380px;
      display: none;
      z-index: 500;
      padding: 14px 18px;
      border-radius: 13px;
      background: #15151d;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      font-size: 13px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: #bbf7d0;
      border-color: rgba(34,197,94,.3);
    }

    .message.error {
      color: #fecaca;
      border-color: rgba(239,68,68,.3);
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        width: 100%;
        margin-right: 0;
        padding: 20px;
      }

      .mobile-header {
        display: flex;
      }
    }

    @media (max-width: 650px) {
      .page-head {
        flex-direction: column;
      }

      .page-head .primary-btn {
        width: 100%;
      }

      .toolbar {
        flex-direction: column;
      }

      .filter,
      .count {
        width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>

</head>

  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const sidebar = document.getElementById("sidebar");
  const menuBtn = document.getElementById("menuBtn");

  const examsGrid = document.getElementById("examsGrid");
  const searchInput = document.getElementById("searchInput");
  const subjectFilter = document.getElementById("subjectFilter");
  const countBox = document.getElementById("countBox");

  const addBtn = document.getElementById("addBtn");
  const overlay = document.getElementById("modalOverlay");
  const closeModal = document.getElementById("closeModal");
  const cancelBtn = document.getElementById("cancelBtn");

  const form = document.getElementById("examForm");
  const modalTitle = document.getElementById("modalTitle");
  const saveBtn = document.getElementById("saveBtn");

  const examIdInput = document.getElementById("examId");
  const titleInput = document.getElementById("title");
  const subjectIdInput = document.getElementById("subjectId");
  const questionCountInput = document.getElementById("questionCount");
  const durationInput = document.getElementById("duration");
  const totalMarksInput = document.getElementById("totalMarks");
  const priceInput = document.getElementById("price");
  const orderInput = document.getElementById("order");
  const descriptionInput = document.getElementById("description");
  const isPublishedInput = document.getElementById("isPublished");
  const isOpenInput = document.getElementById("isOpen");

  const message = document.getElementById("message");
  const logoutBtn = document.getElementById("logoutBtn");

  let exams = [];
  let subjects = [];

  function showMessage(text, type = "success") {

    message.textContent = text;
    message.className = `message show ${type}`;

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {
      message.className = "message";
    }, 3500);
  }

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getSubjectName(subjectId, fallback = "") {

    const subject = subjects.find(
      item => item.id === subjectId
    );

    return subject?.name || fallback || "بدون مادة";
  }

  function populateSubjects() {

    const currentFormValue =
      subjectIdInput.value;

    const currentFilterValue =
      subjectFilter.value;

    subjectIdInput.innerHTML = `
      <option value="">
        اختر المادة
      </option>
    `;

    subjectFilter.innerHTML = `
      <option value="">
        كل المواد
      </option>
    `;

    subjects
      .slice()
      .sort((a, b) =>
        Number(a.order ?? 0) -
        Number(b.order ?? 0)
      )
      .forEach(subject => {

        const option =
          document.createElement("option");

        option.value = subject.id;
        option.textContent = subject.name || "بدون اسم";

        subjectIdInput.appendChild(option);

        const filterOption =
          document.createElement("option");

        filterOption.value = subject.id;
        filterOption.textContent = subject.name || "بدون اسم";

        subjectFilter.appendChild(filterOption);
      });

    if (
      subjects.some(
        subject => subject.id === currentFormValue
      )
    ) {
      subjectIdInput.value = currentFormValue;
    }

    if (
      subjects.some(
        subject => subject.id === currentFilterValue
      )
    ) {
      subjectFilter.value = currentFilterValue;
    }
  }

  function openModal(exam = null) {

    overlay.classList.add("show");

    if (exam) {

      modalTitle.textContent = "تعديل الامتحان";

      examIdInput.value = exam.id;

      titleInput.value =
        exam.title ||
        exam.name ||
        "";

      subjectIdInput.value =
        exam.subjectId ||
        "";

      questionCountInput.value =
        Number(
          exam.questionCount ??
          exam.questionsCount ??
          exam.questions ??
          0
        );

      durationInput.value =
        Number(
          exam.durationMinutes ??
          exam.duration ??
          30
        );

      totalMarksInput.value =
        Number(
          exam.totalMarks ??
          exam.total ??
          0
        );

      priceInput.value =
        Number(exam.price ?? 0);

      orderInput.value =
        Number(exam.order ?? 0);

      descriptionInput.value =
        exam.description || "";

      isPublishedInput.checked =
        exam.isPublished !== false;

      isOpenInput.checked =
        exam.isOpen !== false &&
        exam.status !== "closed";

      saveBtn.textContent =
        "حفظ التعديلات";

    } else {

      modalTitle.textContent =
        "إضافة امتحان";

      form.reset();

      examIdInput.value = "";

      questionCountInput.value = 0;
      durationInput.value = 30;
      totalMarksInput.value = 0;
      priceInput.value = 0;
      orderInput.value = 0;

      isPublishedInput.checked = true;
      isOpenInput.checked = true;

      saveBtn.textContent =
        "حفظ الامتحان";
    }
  }

  function closeModalWindow() {
    overlay.classList.remove("show");
  }

  function renderExams() {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();

    const selectedSubject =
      subjectFilter.value;

    const filtered = exams.filter(exam => {

      const title = String(
        exam.title ||
        exam.name ||
        ""
      ).toLowerCase();

      const description = String(
        exam.description ||
        ""
      ).toLowerCase();

      const subjectName = String(
        exam.subjectName ||
        exam.subject ||
        getSubjectName(exam.subjectId)
      ).toLowerCase();

      const matchesSearch =
        !query ||
        title.includes(query) ||
        description.includes(query) ||
        subjectName.includes(query);

      const matchesSubject =
        !selectedSubject ||
        exam.subjectId === selectedSubject;

      return matchesSearch && matchesSubject;
    });

    countBox.textContent =
      `${filtered.length} امتحان`;

    if (!filtered.length) {

      examsGrid.innerHTML = `
        <div class="empty">
          لا توجد امتحانات مطابقة.
        </div>
      `;

      return;
    }

    examsGrid.innerHTML =
      filtered.map(exam => {

        const title =
          exam.title ||
          exam.name ||
          "بدون اسم";

        const subjectName =
          exam.subjectName ||
          exam.subject ||
          getSubjectName(
            exam.subjectId
          );

        const questionCount =
          Number(
            exam.questionCount ??
            exam.questionsCount ??
            exam.questions ??
            0
          );

        const duration =
          Number(
            exam.durationMinutes ??
            exam.duration ??
            0
          );

        const totalMarks =
          Number(
            exam.totalMarks ??
            exam.total ??
            0
          );

        const price =
          Number(exam.price ?? 0);

        const isOpen =
          exam.isOpen !== false &&
          exam.status !== "closed";

        return `
          <article class="exam-card">

            <div class="exam-top">

              <div class="exam-icon">
                ✓
              </div>

              <span class="status ${isOpen ? "open" : "closed"}">
                ${isOpen ? "مفتوح" : "مغلق"}
              </span>

            </div>

            <h3>
              ${escapeHTML(title)}
            </h3>

            <div class="description">
              ${escapeHTML(
                exam.description ||
                "لا يوجد وصف للامتحان."
              )}
            </div>

            <div class="meta">

              <div class="meta-item">
                المادة
                <strong>
                  ${escapeHTML(subjectName)}
                </strong>
              </div>

              <div class="meta-item">
                الأسئلة
                <strong>
                  ${questionCount}
                </strong>
              </div>

              <div class="meta-item">
                المدة
                <strong>
                  ${duration} دقيقة
                </strong>
              </div>

              <div class="meta-item">
                الدرجة
                <strong>
                  ${totalMarks}
                </strong>
              </div>

            </div>

            <div class="card-footer">

              <span class="price">
                ${
                  price > 0
                    ? `${price} جنيه`
                    : "مجاني"
                }
              </span>

              <div class="actions">

                <button
                  class="small-btn"
                  data-action="edit"
                  data-id="${exam.id}"
                >
                  تعديل
                </button>

                <button
                  class="small-btn delete"
                  data-action="delete"
                  data-id="${exam.id}"
                >
                  حذف
                </button>

              </div>

            </div>

          </article>
        `;
      }).join("");
  }

  examsGrid.addEventListener("click", async event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );

    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;

    const exam =
      exams.find(item => item.id === id);

    if (!exam) return;

    if (action === "edit") {

      openModal(exam);

      return;
    }

    if (action === "delete") {

      const title =
        exam.title ||
        exam.name ||
        "هذا الامتحان";

      const confirmed =
        confirm(
          `هل أنت متأكد من حذف "${title}"؟\n\nسيتم حذف بيانات الامتحان فقط.`
        );

      if (!confirmed) return;

      try {

        await deleteDoc(
          doc(db, "exams", id)
        );

        showMessage(
          "تم حذف الامتحان بنجاح."
        );

      } catch (error) {

        console.error(
          "DELETE EXAM ERROR:",
          error
        );

        showMessage(
          "تعذر حذف الامتحان.",
          "error"
        );
      }
    }
  });

  form.addEventListener("submit", async event => {

    event.preventDefault();

    const title =
      titleInput.value.trim();

    const subjectId =
      subjectIdInput.value;

    if (!title) {

      showMessage(
        "اكتب اسم الامتحان.",
        "error"
      );

      titleInput.focus();

      return;
    }

    if (!subjectId) {

      showMessage(
        "اختر المادة.",
        "error"
      );

      subjectIdInput.focus();

      return;
    }

    const subjectName =
      getSubjectName(subjectId);

    const questionCount =
      Math.max(
        0,
        Number(
          questionCountInput.value || 0
        )
      );

    const durationMinutes =
      Math.max(
        1,
        Number(
          durationInput.value || 30
        )
      );

    const totalMarks =
      Math.max(
        0,
        Number(
          totalMarksInput.value || 0
        )
      );

    const price =
      Math.max(
        0,
        Number(
          priceInput.value || 0
        )
      );

    const order =
      Math.max(
        0,
        Number(
          orderInput.value || 0
        )
      );

    const isPublished =
      isPublishedInput.checked;

    const isOpen =
      isOpenInput.checked;

    const data = {

      title,
      name: title,

      description:
        descriptionInput.value.trim(),

      subjectId,
      subjectName,
      subject: subjectName,

      questionCount,
      questionsCount: questionCount,
      questions: questionCount,

      durationMinutes,
      duration: durationMinutes,

      totalMarks,
      total: totalMarks,

      price,

      isPublished,
      isOpen,

      status:
        isOpen
          ? "open"
          : "closed",

      order,

      updatedAt:
        serverTimestamp()
    };

    saveBtn.disabled = true;
    saveBtn.textContent =
      "جاري الحفظ...";

    try {

      const existingId =
        examIdInput.value.trim();

      if (existingId) {

        await updateDoc(
          doc(db, "exams", existingId),
          data
        );

        showMessage(
          "تم تعديل الامتحان بنجاح."
        );

      } else {

        await addDoc(
          collection(db, "exams"),
          {
            ...data,
            createdAt:
              serverTimestamp()
          }
        );

        showMessage(
          "تمت إضافة الامتحان بنجاح."
        );
      }

      closeModalWindow();

    } catch (error) {

      console.error(
        "SAVE EXAM ERROR:",
        error
      );

      showMessage(
        "حدث خطأ أثناء حفظ الامتحان.",
        "error"
      );

    } finally {

      saveBtn.disabled = false;

      saveBtn.textContent =
        examIdInput.value
          ? "حفظ التعديلات"
          : "حفظ الامتحان";
    }
  });

  addBtn.addEventListener(
    "click",
    () => openModal()
  );

  closeModal.addEventListener(
    "click",
    closeModalWindow
  );

  cancelBtn.addEventListener(
    "click",
    closeModalWindow
  );

  overlay.addEventListener("click", event => {

    if (event.target === overlay) {
      closeModalWindow();
    }
  });

  searchInput.addEventListener(
    "input",
    renderExams
  );

  subjectFilter.addEventListener(
    "change",
    renderExams
  );

  menuBtn.addEventListener(
    "click",
    () => {
      sidebar.classList.toggle("open");
    }
  );

  document.querySelectorAll(".nav a")
    .forEach(link => {

      link.addEventListener(
        "click",
        () => {
          sidebar.classList.remove("open");
        }
      );

    });

  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

        location.href = "index.html";

      } catch (error) {

        console.error(
          "LOGOUT ERROR:",
          error
        );

        showMessage(
          "تعذر تسجيل الخروج.",
          "error"
        );
      }
    }
  );

  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        location.href = "index.html";

        return;
      }

      if (
        user.email?.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        alert(
          "ليس لديك صلاحية الدخول."
        );

        signOut(auth).finally(() => {
          location.href = "index.html";
        });

        return;
      }

      onSnapshot(
        collection(db, "subjects"),
        snapshot => {

          subjects =
            snapshot.docs
              .map(item => ({
                id: item.id,
                ...item.data()
              }))
              .sort((a, b) => {

                return Number(a.order ?? 0) -
                  Number(b.order ?? 0);
              });

          populateSubjects();

          renderExams();

        },
        error => {

          console.error(
            "SUBJECTS ERROR:",
            error
          );

          showMessage(
            "تعذر تحميل المواد.",
            "error"
          );
        }
      );

      onSnapshot(
        collection(db, "exams"),
        snapshot => {

          exams =
            snapshot.docs
              .map(item => ({
                id: item.id,
                ...item.data()
              }))
              .sort((a, b) => {

                const orderA =
                  Number(a.order ?? 0);

                const orderB =
                  Number(b.order ?? 0);

                if (orderA !== orderB) {
                  return orderA - orderB;
                }

                return String(
                  a.title ||
                  a.name ||
                  ""
                ).localeCompare(
                  String(
                    b.title ||
                    b.name ||
                    ""
                  ),
                  "ar"
                );
              });

          renderExams();

        },
        error => {

          console.error(
            "EXAMS ERROR:",
            error
          );

          examsGrid.innerHTML = `
            <div class="empty">
              تعذر تحميل الامتحانات من Firestore.
            </div>
          `;

          showMessage(
            "تعذر تحميل الامتحانات.",
            "error"
          );
        }
      );

    }
  );

</script>

</body>
</html>
