<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070b">
  <title>المواد</title>

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07070b;
      --panel: #101016;
      --panel-2: #15151d;
      --border: rgba(255,255,255,.08);
      --text: #f7f7fb;
      --muted: #9a9aa8;
      --purple: #8b5cf6;
      --purple-2: #a78bfa;
      --danger: #ef4444;
      --success: #22c55e;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% 10%, rgba(139,92,246,.12), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(139,92,246,.08), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      background: rgba(10,10,15,.94);
      border-left: 1px solid var(--border);
      padding: 22px 16px;
      z-index: 100;
      overflow-y: auto;
      backdrop-filter: blur(20px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }

    .brand img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 13px;
    }

    .brand-text strong {
      display: block;
      font-family: "Chakra Petch", sans-serif;
      font-size: 22px;
    }

    .brand-text span {
      color: var(--muted);
      font-size: 11px;
    }

    .nav-title {
      color: #666673;
      font-size: 11px;
      margin: 18px 10px 8px;
    }

    .nav {
      display: grid;
      gap: 5px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 13px;
      color: #aaaab7;
      border-radius: 12px;
      font-size: 13px;
      transition: .2s;
    }

    .nav a:hover {
      background: rgba(255,255,255,.05);
      color: white;
    }

    .nav a.active {
      background: rgba(139,92,246,.15);
      color: #c4b5fd;
      border: 1px solid rgba(139,92,246,.22);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 16px;
    }

    .logout {
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      border: 1px solid rgba(239,68,68,.18);
      border-radius: 12px;
      background: rgba(239,68,68,.07);
      color: #fca5a5;
      transition: .2s;
    }

    .logout:hover {
      background: rgba(239,68,68,.13);
    }

    .main {
      width: calc(100% - 260px);
      margin-right: 260px;
      padding: 28px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 27px;
      font-weight: 800;
    }

    .page-title p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      border-radius: 12px;
      padding: 11px 16px;
      transition: .2s;
    }

    .btn:hover {
      border-color: rgba(139,92,246,.4);
      transform: translateY(-1px);
    }

    .btn-primary {
      border-color: rgba(139,92,246,.35);
      background: linear-gradient(135deg, #7c3aed, #8b5cf6);
    }

    .btn-danger {
      color: #fca5a5;
      border-color: rgba(239,68,68,.18);
      background: rgba(239,68,68,.07);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .search {
      flex: 1;
      position: relative;
    }

    .search input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      color: white;
      outline: none;
      border-radius: 13px;
      padding: 13px 16px;
    }

    .search input:focus {
      border-color: rgba(139,92,246,.55);
      box-shadow: 0 0 0 3px rgba(139,92,246,.08);
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }

    .subject-card {
      background: linear-gradient(145deg, rgba(21,21,29,.96), rgba(12,12,17,.96));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 19px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .subject-card::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      background: rgba(139,92,246,.10);
      filter: blur(35px);
      top: -45px;
      left: -25px;
      pointer-events: none;
    }

    .subject-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .subject-icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(139,92,246,.12);
      border: 1px solid rgba(139,92,246,.18);
      font-size: 22px;
    }

    .subject-order {
      color: #777783;
      font-size: 11px;
    }

    .subject-card h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .subject-card p {
      min-height: 42px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 12px;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .meta-item {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 10px;
      padding: 9px;
    }

    .meta-item span {
      display: block;
      color: #737380;
      font-size: 10px;
    }

    .meta-item strong {
      display: block;
      margin-top: 2px;
      font-size: 13px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .card-actions button {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: white;
      font-size: 12px;
    }

    .card-actions .edit:hover {
      border-color: rgba(139,92,246,.4);
      color: #c4b5fd;
    }

    .card-actions .delete {
      color: #fca5a5;
    }

    .card-actions .delete:hover {
      border-color: rgba(239,68,68,.3);
      background: rgba(239,68,68,.06);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 55px 20px;
      text-align: center;
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: white;
      margin-bottom: 5px;
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(560px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #111117;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 30px 100px rgba(0,0,0,.55);
      padding: 22px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .modal-head h2 {
      font-size: 20px;
    }

    .close {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: white;
      border-radius: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #aaaab5;
      font-size: 12px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: #0a0a0f;
      color: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(139,92,246,.55);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #c5c5ce;
      font-size: 12px;
      margin-top: 4px;
    }

    .checkbox input {
      accent-color: var(--purple);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
    }

    .toast {
      position: fixed;
      left: 25px;
      bottom: 25px;
      min-width: 250px;
      max-width: 390px;
      padding: 13px 16px;
      border-radius: 13px;
      background: #15151c;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 1000;
      font-size: 13px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: rgba(34,197,94,.25);
    }

    .toast.error {
      border-color: rgba(239,68,68,.25);
    }

    .mobile-menu {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      border-radius: 11px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 90;
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(105%);
        transition: .25s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .overlay.show {
        display: block;
      }

      .main {
        width: 100%;
        margin-right: 0;
        padding: 20px;
      }

      .mobile-menu {
        display: block;
      }

      .topbar {
        align-items: flex-start;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        flex-wrap: wrap;
      }

      .page-title {
        flex: 1;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions .btn-primary {
        width: 100%;
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .search {
        flex-basis: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>

</head>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyCvMG9-rIdjnzQR_plZyizpQAhxQ_ASIn0",
    authDomain: "mathix-88811.firebaseapp.com",
    projectId: "mathix-88811",

    messagingSenderId: "1043867239139",

  };

  const ADMIN_EMAIL = "z1wae12008@gmail.com";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const subjectsGrid =
    document.getElementById("subjectsGrid");

  const searchInput =
    document.getElementById("searchInput");

  const countText =
    document.getElementById("countText");

  const subjectModal =
    document.getElementById("subjectModal");

  const subjectForm =
    document.getElementById("subjectForm");

  const modalTitle =
    document.getElementById("modalTitle");

  const addSubjectBtn =
    document.getElementById("addSubjectBtn");

  const closeModal =
    document.getElementById("closeModal");

  const cancelBtn =
    document.getElementById("cancelBtn");

  const saveBtn =
    document.getElementById("saveBtn");

  const subjectName =
    document.getElementById("subjectName");

  const subjectCode =
    document.getElementById("subjectCode");

  const subjectIcon =
    document.getElementById("subjectIcon");

  const subjectOrder =
    document.getElementById("subjectOrder");

  const subjectDescription =
    document.getElementById("subjectDescription");

  const lessonsCount =
    document.getElementById("lessonsCount");

  const progress =
    document.getElementById("progress");

  const subjectPublished =
    document.getElementById("subjectPublished");

  const toast =
    document.getElementById("toast");

  const sidebar =
    document.getElementById("sidebar");

  const mobileMenu =
    document.getElementById("mobileMenu");

  const overlay =
    document.getElementById("overlay");

  const logoutBtn =
    document.getElementById("logoutBtn");

  let subjects = [];
  let editingId = null;


  function showToast(message, type = "") {

    toast.textContent = message;

    toast.className =
      "toast show " + type;

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {

      toast.className = "toast";

    }, 3000);
  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function openModal(subject = null) {

    editingId =
      subject?.id || null;

    modalTitle.textContent =
      editingId
        ? "تعديل المادة"
        : "إضافة مادة";

    subjectName.value =
      subject?.name || "";

    subjectCode.value =
      subject?.code || "";

    subjectIcon.value =
      subject?.icon || "";

    subjectOrder.value =
      Number(subject?.order ?? 0);

    subjectDescription.value =
      subject?.description || "";

    lessonsCount.value =
      Number(subject?.lessonsCount ?? 0);

    progress.value =
      Number(subject?.progress ?? 0);

    subjectPublished.checked =
      subject?.isPublished !== false;

    subjectModal.classList.add("show");

    setTimeout(() => {

      subjectName.focus();

    }, 100);
  }


  function closeSubjectModal() {

    subjectModal.classList.remove("show");

    subjectForm.reset();

    editingId = null;

    subjectOrder.value = 0;
    lessonsCount.value = 0;
    progress.value = 0;
    subjectPublished.checked = true;
  }


  function renderSubjects() {

    const search =
      searchInput.value.trim().toLowerCase();

    const filtered =
      subjects.filter(subject => {

        const name =
          String(subject.name || "")
            .toLowerCase();

        const code =
          String(subject.code || "")
            .toLowerCase();

        const description =
          String(subject.description || "")
            .toLowerCase();

        return (
          !search ||
          name.includes(search) ||
          code.includes(search) ||
          description.includes(search)
        );

      });


    countText.textContent =
      `${filtered.length} مادة`;


    if (!filtered.length) {

      subjectsGrid.innerHTML = `
        <div class="empty">
          <strong>لا توجد مواد</strong>

          <span>
            ${
              search
                ? "لم يتم العثور على مادة مطابقة للبحث."
                : "ابدأ بإضافة أول مادة دراسية."
            }
          </span>
        </div>
      `;

      return;
    }


    subjectsGrid.innerHTML =
      filtered.map(subject => {

        const name =
          escapeHTML(
            subject.name || "بدون اسم"
          );

        const code =
          escapeHTML(
            subject.code || "—"
          );

        const description =
          escapeHTML(
            subject.description ||
            "لا يوجد وصف للمادة."
          );

        const icon =
          escapeHTML(
            subject.icon ||
            subject.code ||
            "∑"
          );

        const order =
          Number(subject.order ?? 0);

        const lessons =
          Number(subject.lessonsCount ?? 0);

        const subjectProgress =
          Math.min(
            100,
            Math.max(
              0,
              Number(subject.progress ?? 0)
            )
          );

        const published =
          subject.isPublished !== false;


        return `
          <article class="subject-card">

            <div class="subject-head">

              <div class="subject-icon">
                ${icon}
              </div>

              <div class="subject-order">
                ترتيب ${order}
              </div>

            </div>

            <h3>${name}</h3>

            <p>${description}</p>

            <div class="meta">

              <div class="meta-item">
                <span>الكود</span>
                <strong>${code}</strong>
              </div>

              <div class="meta-item">
                <span>الدروس</span>
                <strong>${lessons}</strong>
              </div>

              <div class="meta-item">
                <span>التقدم</span>
                <strong>${subjectProgress}%</strong>
              </div>

              <div class="meta-item">
                <span>الحالة</span>
                <strong>
                  ${published ? "نشطة" : "مخفية"}
                </strong>
              </div>

            </div>

            <div class="card-actions">

              <button
                type="button"
                class="edit"
                data-action="edit"
                data-id="${escapeHTML(subject.id)}"
              >
                تعديل
              </button>

              <button
                type="button"
                class="delete"
                data-action="delete"
                data-id="${escapeHTML(subject.id)}"
              >
                حذف
              </button>

            </div>

          </article>
        `;

      }).join("");
  }


  async function saveSubject(event) {

    event.preventDefault();

    const name =
      subjectName.value.trim();

    const code =
      subjectCode.value.trim();

    const icon =
      subjectIcon.value.trim();

    const description =
      subjectDescription.value.trim();

    const order =
      Number(subjectOrder.value || 0);

    const lessonsCountValue =
      Number(lessonsCount.value || 0);

    const progressValue =
      Number(progress.value || 0);


    if (!name) {

      showToast(
        "اكتب اسم المادة.",
        "error"
      );

      subjectName.focus();

      return;
    }


    if (
      progressValue < 0 ||
      progressValue > 100
    ) {

      showToast(
        "نسبة التقدم يجب أن تكون بين 0 و100.",
        "error"
      );

      return;
    }


    const data = {
      name,
      code,
      icon,
      description,
      order,
      lessonsCount: lessonsCountValue,
      progress: progressValue,
      isPublished: subjectPublished.checked
    };


    saveBtn.disabled = true;
    saveBtn.textContent =
      "جاري الحفظ...";


    try {

      if (editingId) {

        await updateDoc(
          doc(
            db,
            "subjects",
            editingId
          ),
          {
            ...data,
            updatedAt: serverTimestamp()
          }
        );

        showToast(
          "تم تعديل المادة بنجاح.",
          "success"
        );

      } else {

        await addDoc(
          collection(
            db,
            "subjects"
          ),
          {
            ...data,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          }
        );

        showToast(
          "تمت إضافة المادة بنجاح.",
          "success"
        );
      }

      closeSubjectModal();

    } catch (error) {

      console.error(
        "SAVE SUBJECT ERROR:",
        error
      );

      showToast(
        "حدث خطأ أثناء حفظ المادة.",
        "error"
      );

    } finally {

      saveBtn.disabled = false;

      saveBtn.textContent =
        "حفظ المادة";
    }
  }


  async function deleteSubject(id) {

    const subject =
      subjects.find(
        item => item.id === id
      );

    if (!subject) return;


    const confirmed =
      confirm(
        `هل أنت متأكد من حذف مادة "${
          subject.name || "هذه المادة"
        }"؟\n\nحذف المادة من هنا لا يحذف الدروس المرتبطة بها تلقائيًا.`
      );


    if (!confirmed) return;


    try {

      await deleteDoc(
        doc(
          db,
          "subjects",
          id
        )
      );

      showToast(
        "تم حذف المادة.",
        "success"
      );

    } catch (error) {

      console.error(
        "DELETE SUBJECT ERROR:",
        error
      );

      showToast(
        "حدث خطأ أثناء حذف المادة.",
        "error"
      );
    }
  }


  function startSubjectsListener() {

    const subjectsRef =
      collection(
        db,
        "subjects"
      );

    const orderedQuery =
      query(
        subjectsRef,
        orderBy(
          "order",
          "asc"
        )
      );


    onSnapshot(
      orderedQuery,

      snapshot => {

        subjects =
          snapshot.docs.map(
            item => ({
              id: item.id,
              ...item.data()
            })
          );

        renderSubjects();
      },

      error => {

        console.error(
          "ORDERED SUBJECTS ERROR:",
          error
        );


        onSnapshot(
          subjectsRef,

          fallbackSnapshot => {

            subjects =
              fallbackSnapshot.docs
                .map(
                  item => ({
                    id: item.id,
                    ...item.data()
                  })
                )
                .sort(
                  (a, b) =>
                    Number(a.order ?? 0) -
                    Number(b.order ?? 0)
                );

            renderSubjects();

          },

          fallbackError => {

            console.error(
              "SUBJECTS ERROR:",
              fallbackError
            );

            subjectsGrid.innerHTML = `
              <div class="empty">
                <strong>تعذر تحميل المواد</strong>

                <span>
                  تأكد من Firestore Rules والاتصال بقاعدة البيانات.
                </span>
              </div>
            `;

            countText.textContent =
              "0 مادة";
          }
        );
      }
    );
  }


  onAuthStateChanged(
    auth,
    user => {

      if (!user) {

        window.location.href =
          "index.html";

        return;
      }


      /*
        تم إزالة شرط emailVerified.
        الدخول للإدارة يعتمد على بريد المدير فقط.
      */

      if (
        String(user.email || "")
          .toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        signOut(auth);

        window.location.href =
          "index.html";

        return;
      }


      startSubjectsListener();
    }
  );


  addSubjectBtn.addEventListener(
    "click",
    () => openModal()
  );


  closeModal.addEventListener(
    "click",
    closeSubjectModal
  );


  cancelBtn.addEventListener(
    "click",
    closeSubjectModal
  );


  subjectModal.addEventListener(
    "click",
    event => {

      if (
        event.target === subjectModal
      ) {

        closeSubjectModal();
      }
    }
  );


  subjectForm.addEventListener(
    "submit",
    saveSubject
  );


  searchInput.addEventListener(
    "input",
    renderSubjects
  );


  subjectsGrid.addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          "button[data-action]"
        );

      if (!button) return;


      const action =
        button.dataset.action;

      const id =
        button.dataset.id;


      if (action === "edit") {

        const subject =
          subjects.find(
            item => item.id === id
          );

        if (subject) {
          openModal(subject);
        }

      } else if (
        action === "delete"
      ) {

        deleteSubject(id);
      }
    }
  );


  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

        window.location.href =
          "index.html";

      } catch (error) {

        console.error(
          "LOGOUT ERROR:",
          error
        );

        showToast(
          "تعذر تسجيل الخروج.",
          "error"
        );
      }
    }
  );


  mobileMenu.addEventListener(
    "click",
    () => {

      sidebar.classList.add("open");

      overlay.classList.add("show");
    }
  );


  overlay.addEventListener(
    "click",
    () => {

      sidebar.classList.remove(
        "open"
      );

      overlay.classList.remove(
        "show"
      );
    }
  );


  document
    .querySelectorAll(".nav a")
    .forEach(link => {

      link.addEventListener(
        "click",
        () => {

          sidebar.classList.remove(
            "open"
          );

          overlay.classList.remove(
            "show"
          );
        }
      );

    });

</script>

</body>
</html>
